spring:
  application:
    name: panaderia-api
  config:
    import: optional:file:.env[.properties]
  datasource:
    url: jdbc:mysql://localhost:3306/panaderia?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
    username: ${DB_USER:root}
    password: ${DB_PASSWORD}
  flyway:
    enabled: true
    locations: classpath:db/migration
